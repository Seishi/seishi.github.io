  <style>
    :root {
      color-scheme: light;
      --bg: #F3F5F8;
      --panel: #FFFFFF;
      --inset: #F7F8FA;
      --line: #E2E7EE;
      --line-2: #D3DAE3;
      --text: #1A2330;
      --text-2: #3D4A5C;
      --muted: #6B7787;
      --faint: #98A2AE;
      --accent: #2563EB;
      --accent-dark: #1D4ED8;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --on-accent: #FFFFFF;
      --shadow: 0 1px 2px rgba(26, 35, 48, 0.06), 0 8px 24px rgba(26, 35, 48, 0.04);
      --font-body: 'Instrument Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0A0D12;
      --panel: #0E131A;
      --inset: #0B1016;
      --line: #1F2731;
      --line-2: #243040;
      --text: #E7ECF2;
      --text-2: #B8C1CC;
      --muted: #8B96A5;
      --faint: #4E5A69;
      --accent: #60A5FA;
      --accent-dark: #3B82F6;
      --accent-soft: rgba(96, 165, 250, 0.16);
      --on-accent: #0A1628;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
    body { min-height: 100vh; }
    a { color: inherit; }
    header {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .bar {
      max-width: 980px; margin: 0 auto; padding: 16px 20px 14px;
      display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center;
    }
    .brand { flex: 1 1 180px; min-width: 0; }
    .brand h1 {
      margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.02em;
    }
    .brand p {
      margin: 4px 0 0; color: var(--muted); font-size: 12px;
      font-family: var(--font-mono);
    }
    .search {
      flex: 2 1 240px;
      position: relative;
    }
    .search input {
      width: 100%; height: 38px; padding: 0 12px 0 34px;
      border: 1px solid var(--line-2); border-radius: 8px;
      background: var(--panel); color: var(--text);
      font: 14px/1 var(--font-body); outline: none;
    }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search svg {
      position: absolute; left: 10px; top: 10px; width: 16px; height: 16px;
      color: var(--faint);
    }
    .theme {
      width: 38px; height: 38px; border-radius: 8px;
      border: 1px solid var(--line-2); background: var(--panel); color: var(--text-2);
      cursor: pointer; display: grid; place-items: center;
    }
    .theme:hover { border-color: var(--accent); color: var(--accent); }
    .filters {
      max-width: 980px; margin: 0 auto; padding: 0 20px 14px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .chip {
      border: 1px solid var(--line-2); background: var(--panel); color: var(--text-2);
      border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer;
    }
    .chip.is-on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    main { max-width: 980px; margin: 0 auto; padding: 18px 20px 48px; }
    .grid { display: grid; gap: 12px; }
    .card {
      display: grid; grid-template-columns: auto 1fr auto; gap: 12px 16px;
      align-items: start;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px 18px; text-decoration: none; box-shadow: var(--shadow);
      transition: border-color .15s ease, transform .15s ease;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .badge {
      font-family: var(--font-mono); font-size: 12px; font-weight: 500;
      padding: 4px 8px; border-radius: 999px; background: var(--accent-soft);
      color: var(--accent-dark); white-space: nowrap;
    }
    html[data-theme="dark"] .badge { color: var(--accent); }
    .body { min-width: 0; }
    .kicker {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      color: var(--muted); font-size: 12px; font-family: var(--font-mono);
      margin-bottom: 6px;
    }
    .title {
      margin: 0; font-size: 15px; font-weight: 500; line-height: 1.55; color: var(--text);
    }
    .go {
      align-self: center; color: var(--faint); font-size: 13px; white-space: nowrap;
      font-family: var(--font-mono);
    }
    .card:hover .go { color: var(--accent); }
    .empty { text-align: center; color: var(--muted); padding: 48px 12px; }
    @media (max-width: 640px) {
      .card { grid-template-columns: auto 1fr; }
      .go { display: none; }
    }
  </style>

-ex16-hyperbola-lambda/index.html", "slug": "ex16-hyperbola-lambda", "label": "例题 16", "tags": ["hyperbola"], "title": "双曲线 $\\Gamma:x^{2}-y^{2}=1$ 上三点 $A,B,C$ 满足 $AB\\perp AC$，且 $B,C$ 不在同一支。过 $A$ 的切线交 $BC$ 于 $H$。若 $|BH|\\ge|CH|$，求最大的实数 $\\lambda$，使 $|BH|\\cdot|BC|\\ge\\lambda$ 恒成立。", "created": "2026-10-03T22:08:33+08:00", "date": "2026-10-03", "source": true, "seq": 17, "day": "20261003"}, {"id": "20261003-18-ex17-ellipse-slope-ratio", "href": "problems/20261003-18-ex17-ellipse-slope-ratio/index.html", "slug": "ex17-ellipse-slope-ratio", "label": "例题 17", "tags": ["ellipse"], "title": "椭圆 $C:\\dfrac{x^{2}}{a^{2}}+\\dfrac{y^{2}}{b^{2}}=1$ 的左、右焦点为 $F_1,F_2$。点 $D(1,0)$ 是线段 $OF_2$ 的中点。直线 $MN$（不与 $x$ 轴重合）过 $F_1$，交椭圆于 $M,N$。延长 $MD$、$ND$ 再交椭圆于 $P,Q$。设 $MN$、$PQ$ 的斜率为 $k_1,k_2$，将 $\\dfrac{k_2}{k_1}$ 表示成关于 $a$ 的函数 $f(a)$，并求其极值。 (1) 把 $\\dfrac{k_2}{k_1}$ 表示成 $f(a)$； (2) 求 $f(a)$ 的极值。", "created": "2026-10-03T22:08:33+08:00", "date": "2026-10-03", "source": true, "seq": 18, "day": "20261003"}, {"id": "20261003-19-ex18-parabolas-integer-k", "href": "problems/20261003-19-ex18-parabolas-integer-k/index.html", "slug": "ex18-parabolas-integer-k", "label": "例题 18", "tags": ["parabola"], "title": "设 $S$ 是满足下列条件的正整数 $k$ 的集合：抛物线 $y=x^{2}-k$ 与 $x=2(y-20)^{2}-k$ 有四个不同的公共点，且这四点所在圆的半径不超过 $21$。求 $S$ 中最小元素与最大元素的和。", "created": "2026-10-03T22:08:33+08:00", "date": "2026-10-03", "source": true, "seq": 19, "day": "20261003"}, {"id": "20261003-20-ex19-parabolas-concyclic", "href": "problems/20261003-20-ex19-parabolas-concyclic/index.html", "slug": "ex19-parabolas-concyclic", "label": "例题 19", "tags": ["parabola"], "title": "平面上两条抛物线 $C_1,C_2$ 焦点重合，准线分别为 $l_1,l_2$。$l_1$ 与 $C_2$ 交于 $A,B$，$l_2$ 与 $C_1$ 交于 $C,D$。证明 $A,B,C,D$ 四点共圆。", "created": "2026-10-03T22:08:33+08:00", "date": "2026-10-03", "source": true, "seq": 20, "day": "20261003"}, {"id": "20261003-21-ex20-ellipse-midpoint-circle", "href": "problems/20261003-21-ex20-ellipse-midpoint-circle/index.html", "slug": "ex20-ellipse-midpoint-circle", "label": "例题 20", "tags": ["ellipse"], "title": "椭圆 $\\mathcal{E}$ 的焦点为 $F_1,F_2$，$P$ 在 $\\mathcal{E}$ 上。直线 $PF_1$、$PF_2$ 分别再交 $\\mathcal{E}$ 于 $A,B$，点 $A,B$ 处的切线交于 $Q$。证明 $PQ$ 的中点在 $\\triangle PF_1F_2$ 的外接圆上。", "created": "2026-10-03T22:08:33+08:00", "date": "2026-10-03", "source": true, "seq": 21, "day": "20261003"}];
    const KINDS = [
      { id: 'all', label: '全部' },
      { id: 'line-circle', label: '直线与圆' },
      { id: 'ellipse', label: '椭圆' },
      { id: 'hyperbola', label: '双曲线' },
      { id: 'parabola', label: '抛物线' },
      { id: 'parametric-polar', label: '参数与极坐标' }
    ];
    const TAG_LABELS = {
      'line-circle': '直线与圆',
      'ellipse': '椭圆',
      'hyperbola': '双曲线',
      'parabola': '抛物线',
      'parametric-polar': '参数与极坐标'
    };
    let kind = 'all';
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const q = document.getElementById('q');
    const filters = document.getElementById('filters');
    const countEl = document.getElementById('count');

    KINDS.forEach((k) => {
      const n = k.id === 'all'
        ? PROBLEMS.length
        : PROBLEMS.filter((p) => (p.tags || []).includes(k.id)).length;
      if (k.id !== 'all' && n === 0) return;
      const b = document.createElement('button');
      b.className = 'chip' + (k.id === 'all' ? ' is-on' : '');
      b.type = 'button';
      b.dataset.kind = k.id;
      b.textContent = k.label + ' ' + n;
      b.addEventListener('click', () => {
        kind = k.id;
        filters.querySelectorAll('.chip').forEach((c) => c.classList.toggle('is-on', c.dataset.kind === kind));
        render();
      });
      filters.appendChild(b);
    });

    function hay(p) {
      return [p.title, p.slug, p.label].join(' ').toLowerCase();
    }
    function visible() {
      const s = (q.value || '').trim().toLowerCase();
      return PROBLEMS.filter((p) =>
        (kind === 'all' || (p.tags || []).includes(kind)) && (!s || hay(p).includes(s)));
    }
    function tagText(p) {
      return (p.tags || []).map((t) => TAG_LABELS[t] || t).join(' · ');
    }
    function render() {
      const rows = visible();
      list.innerHTML = '';
      empty.hidden = rows.length > 0;
      countEl.textContent = String(rows.length);
      rows.forEach((p) => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = p.href;
        const tags = tagText(p);
        a.innerHTML =
          '<span class="badge">' + (p.label || '') + '</span>' +
          '<div class="body">' +
            '<div class="kicker">' +
              (tags ? '<span>' + tags + '</span>' : '') +
              (p.date ? '<span>' + p.date + '</span>' : '') +
              (p.source ? '<span>原图</span>' : '') +
            '</div>' +
            '<p class="title">' + (p.title || p.slug || '') + '</p>' +
          '</div>' +
          '<span class="go">打开 →</span>';
        list.appendChild(a);
      });
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([list]).catch(() => {});
      }
    }
    q.addEventListener('input', render);
    document.getElementById('theme').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('analytical-geometry-theme', next); } catch (e) {}
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== q) {
        e.preventDefault();
        q.focus();
      }
    });
    render();
    const wait = setInterval(() => {
      if (window.MathJax && window.MathJax.typesetPromise) {
        clearInterval(wait);
        MathJax.typesetPromise([list]).catch(() => {});
      }
    }, 80);
  </script>
