题 · 空间折线", "title": "已知空间中五个点 $A,B,C,D,E$ 满足 $AB=BC=CD=DE=EA$，且 $\\angle ABC,\\angle BCD,\\angle CDE,\\angle DEA,\\angle EAB$ 中有四个是直角，求最后一个角的所有可能大小", "source": true}, {"id": "20261002-20-ex19-tetra-volume", "href": "20261002-20-ex19-tetra-volume/index.html", "slug": "ex19-tetra-volume", "label": "例题 19", "kind": "ex", "num": 19, "seq": 20, "day": "20261002", "date": "2026-10-02", "created": "2026-10-02T20:38:42+08:00", "meta": "交互解题 · 体积", "title": "在空间直角坐标系 $O$-$xyz$ 中，一个正四面体的顶点 $A,B,C,D$ 的横坐标分别为 $2,3,5,7$，则该正四面体的体积是", "source": true}, {"id": "20261002-21-ex20-pyramid-ad-max", "href": "20261002-21-ex20-pyramid-ad-max/index.html", "slug": "ex20-pyramid-ad-max", "label": "例题 20", "kind": "ex", "num": 20, "seq": 21, "day": "20261002", "date": "2026-10-02", "created": "2026-10-02T20:38:42+08:00", "meta": "交互解题 · 线段最大值", "title": "四棱锥 $P$-$ABCD$ 中，$\\angle PAD=\\angle PBC=135^{\\circ}$，$\\angle PAB=\\angle PBA=60^{\\circ}$，且 $AD\\perp$ 平面 $PBC$。已知 $|AB|=\\sqrt{2}$，平面 $PAB$ 和平面 $PCD$ 所成角的正弦值为 $\\dfrac{1}{3}$，求 $|AD|$ 的最大值", "source": true}, {"id": "20261002-01-pyramid-be-pac", "href": "20261002-01-pyramid-be-pac/index.html", "slug": "pyramid-be-pac", "label": "演示", "kind": "demo", "num": 0, "seq": 1, "day": "20261002", "date": "2026-10-02", "created": "2026-10-02T19:30:38+08:00", "meta": "交互解题 · 线面角", "title": "正四棱锥 $P$-$ABCD$ 中，底面边长为 $2$，高为 $1$，$E$ 为 $PC$ 中点，求直线 $BE$ 与平面 $PAC$ 所成角的正弦值", "source": false}];
    const KINDS = [
      { id: 'all', label: '全部' },
      { id: 'ex', label: '例题' },
      { id: 'exer', label: '习题' },
      { id: 'demo', label: '演示' }
    ];
    let kind = 'all';
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const q = document.getElementById('q');
    const filters = document.getElementById('filters');
    const countEl = document.getElementById('count');

    KINDS.forEach((k) => {
      const n = k.id === 'all' ? PROBLEMS.length : PROBLEMS.filter((p) => p.kind === k.id).length;
      if (k.id !== 'all' && n === 0) return;
      const b = document.createElement('button');
      b.className = 'chip' + (k.id === 'all' ? ' is-on' : '');
      b.type = 'button';
      b.dataset.kind = k.id;
      b.textContent = k.label + ' ' + n;
      b.addEventListener('click', () => {
        kind = k.id;
        filters.querySelectorAll('.chip').forEach((c) => c.classList.toggle('is-on', c.dataset.kind === kind));
        render();
      });
      filters.appendChild(b);
    });

    function hay(p) {
      return [p.label, p.slug, p.title, p.meta, p.date].join(' ').toLowerCase();
    }
    function visible() {
      const s = (q.value || '').trim().toLowerCase();
      return PROBLEMS.filter((p) => (kind === 'all' || p.kind === kind) && (!s || hay(p).includes(s)));
    }
    function render() {
      const rows = visible();
      list.innerHTML = '';
      empty.hidden = rows.length > 0;
      countEl.textContent = String(rows.length);
      rows.forEach((p) => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = p.href;
        a.innerHTML =
          '<span class="badge">' + p.label + '</span>' +
          '<div class="body">' +
            '<div class="kicker">' +
              (p.meta ? '<span>' + p.meta + '</span>' : '') +
              '<span>' + p.date + '</span>' +
              (p.source ? '<span>原图</span>' : '') +
            '</div>' +
            '<p class="title">' + p.title + '</p>' +
          '</div>' +
          '<span class="go">打开 →</span>';
        list.appendChild(a);
      });
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([list]).catch(() => {});
      }
    }
    q.addEventListener('input', render);
    document.getElementById('theme').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('stereometry-theme', next); } catch (e) {}
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== q) {
        e.preventDefault();
        q.focus();
      }
    });
    render();
    const wait = setInterval(() => {
      if (window.MathJax && window.MathJax.typesetPromise) {
        clearInterval(wait);
        MathJax.typesetPromise([list]).catch(() => {});
      }
    }, 80);
  </script>
</body>
</html>
