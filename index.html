<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('geometry-theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <title>几何</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    :root {
      color-scheme: light;
      --bg: #F3F5F8;
      --panel: #FFFFFF;
      --line: #E2E7EE;
      --line-2: #D3DAE3;
      --text: #1A2330;
      --text-2: #3D4A5C;
      --muted: #6B7787;
      --accent: #2563EB;
      --accent-dark: #1D4ED8;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --on-accent: #FFFFFF;
      --shadow: 0 1px 2px rgba(26, 35, 48, 0.06), 0 8px 24px rgba(26, 35, 48, 0.04);
      --font-body: 'Instrument Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0A0D12;
      --panel: #0E131A;
      --line: #1F2731;
      --line-2: #243040;
      --text: #E7ECF2;
      --text-2: #B8C1CC;
      --muted: #8B96A5;
      --accent: #60A5FA;
      --accent-dark: #3B82F6;
      --accent-soft: rgba(96, 165, 250, 0.16);
      --on-accent: #0A1628;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
    body { min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    header {
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 86%, transparent);
    }
    .bar {
      max-width: 880px; margin: 0 auto; padding: 22px 20px 18px;
      display: flex; align-items: center; gap: 16px;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; font-family: var(--font-mono); }
    .theme {
      margin-left: auto; width: 38px; height: 38px; border-radius: 8px;
      border: 1px solid var(--line-2); background: var(--panel); color: var(--text-2);
      cursor: pointer;
    }
    main { max-width: 880px; margin: 0 auto; padding: 28px 20px 64px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card {
      display: block; background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 22px 22px 20px; box-shadow: var(--shadow);
      min-height: 180px;
    }
    .card:hover { border-color: var(--accent); }
    .kicker {
      font-family: var(--font-mono); font-size: 12px; color: var(--accent-dark);
      background: var(--accent-soft); display: inline-block;
      padding: 4px 8px; border-radius: 999px; margin-bottom: 14px;
    }
    html[data-theme="dark"] .kicker { color: var(--accent); }
    .card h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
    .card p { margin: 0; color: var(--text-2); font-size: 14px; line-height: 1.6; }
    .go { display: inline-block; margin-top: 18px; color: var(--accent); font-family: var(--font-mono); font-size: 13px; }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div>
        <h1>几何</h1>
        <p class="sub">解析几何 · 立体几何</p>
      </div>
      <button class="theme" id="theme" type="button" aria-label="切换主题">◐</button>
    </div>
  </header>
  <main>
    <div class="grid">
      <a class="card" href="analytical-geometry/index.html">
        <span class="kicker">平面 · JSXGraph</span>
        <h2>解析几何</h2>
        <p>直线与圆、椭圆、双曲线、抛物线。左侧分步解析，右侧可交互平面图。</p>
        <span class="go">进入题目 →</span>
      </a>
      <a class="card" href="stereometry/problems/index.html">
        <span class="kicker">空间 · Three.js</span>
        <h2>立体几何</h2>
        <p>棱锥、棱柱、球与向量。左侧分步解析，右侧可旋转的空间图形。</p>
        <span class="go">进入题目 →</span>
      </a>
    </div>
  </main>
  <script>
    document.getElementById('theme').addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('geometry-theme', next); } catch (e) {}
    });
  </script>
</body>
</html>
